[package]
name = "cli-auto-panel"
version = "0.1.0"
edition = "2021"
description = "Codex 与 Claude 本地通用配置管理面板"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-single-instance = "2"
config-core = { path = "../crates/config-core" }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
