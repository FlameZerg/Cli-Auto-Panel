<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLI 通用配置面板</title>
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <script>
      // 与偏好提供器共用存储键和默认值，首帧直接使用已保存配色，避免加载后闪变。
      try {
        var stored = localStorage.getItem("cli-auto-panel.theme");
        document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
        var palette = localStorage.getItem("cli-auto-panel.palette");
        if (["jade", "ocean", "violet", "rose", "amber", "slate", "coral", "cyan"].includes(palette)) document.documentElement.dataset.palette = palette;
        document.documentElement.lang = localStorage.getItem("cli-auto-panel.language") === "en" ? "en" : "zh-CN";
      } catch (error) { console.error("读取首帧偏好失败：", error); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
